<script>

//// LOAD CODES FROM SERVER

fetch("/api/codes")
.then(res => res.json())
.then(data => {

document.getElementById("youtube").value = data.youtube || ""
document.getElementById("tiktok").value = data.tiktok || ""
document.getElementById("zoom").value = data.zoom || ""
document.getElementById("whatsapp").value = data.whatsapp || ""

})
.catch(err => console.log("Codes load error", err))



//// COPY FUNCTION

function copyCode(id){

let el = document.getElementById(id)

if(!el.value){
alert("No Code Found")
return
}

navigator.clipboard.writeText(el.value)
.then(()=>alert("Copied!"))
.catch(()=>alert("Copy failed"))

}



//// QR GENERATOR

function makeQR(id,qr){

let code = document.getElementById(id).value

if(!code){
alert("No Code Available")
return
}

document.getElementById(qr).innerHTML=""

new QRCode(document.getElementById(qr),{
text:code,
width:180,
height:180
})

}



//// ONLINE USERS

function updateUsers(){

fetch("/api/users")
.then(res=>res.json())
.then(data=>{
document.getElementById("userCount").innerText =
"Online Users: " + data.users
})
.catch(()=>{})

}

setInterval(updateUsers,3000)

updateUsers()

</script>
